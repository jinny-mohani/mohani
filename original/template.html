<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:'Jua',system-ui,sans-serif;
    background:var(--bgc) var(--bgimg) center/cover no-repeat;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    transition:background-color .3s;
  }
  body.nov{--bgc:#d8b585;--bgimg:url(__nov_bg__);--accent:#be7f35;--num:#ad6d51;--blob:#c99a57;--line:#c99a57;--soft:#f8e0c0}
  body.dec{--bgc:#b3ada0;--bgimg:url(__dec_bg__);--accent:#8c8574;--num:#8a7a66;--blob:#968f7d;--line:#968f7d;--soft:#e9e7e1}

  /* 1024x680 무대: 화면 높이/너비에 맞춰 확대·축소, 가운데 정렬 */
  #stage{position:absolute;left:50%;top:50%;width:1024px;height:680px;transform-origin:0 0}
  .abs{position:absolute;display:block;pointer-events:none}
  .blob{position:absolute;opacity:.5;pointer-events:none}
  .blob path{fill:var(--blob);transition:fill .3s}

  .layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .25s}
  .layer.on{opacity:1;visibility:visible}

  .gnb-hit{position:absolute;top:14px;height:32px;border:0;background:transparent;padding:0;cursor:pointer}

  #grid{position:absolute;left:152.5px;top:159px;width:720px;height:460px}
  .day{position:absolute;width:90px;height:72px;border:0;padding:0;background:transparent;cursor:pointer}
  .day .cell{position:absolute;left:15px;top:9px;width:73px;height:60px;transition:transform .15s}
  .day .num{position:absolute;left:2px;top:-2px;font-size:13px;color:var(--num);line-height:1}
  .day.out{pointer-events:none;opacity:.4}
  .day.today .num{color:#fff;background:var(--accent);border-radius:9px;padding:2px 5px 1px;left:-3px;top:-3px}
  .day .stk{position:absolute;left:24.5px;top:12px;width:54px;height:54px;pointer-events:none;animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}

  /* 팝업 */
  #dim{position:absolute;z-index:50;inset:-100vmax;background:rgba(60,40,20,.28);display:none}
  #dim.on{display:block;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #sheet{position:absolute;left:50%;top:50%;width:600px;transform:translate(-50%,-50%);animation:rise .22s cubic-bezier(.3,1.3,.5,1);
    background:#fffcf2;border:2.5px solid var(--line);border-radius:28px;padding:22px 24px 18px;
    box-shadow:0 10px 30px rgba(80,50,20,.25)}
  @keyframes rise{from{transform:translate(-50%,-46%) scale(.96)}to{transform:translate(-50%,-50%) scale(1)}}
  #sheet::before{content:"";position:absolute;inset:7px;border:2px dashed #fbe9a8;border-radius:22px;pointer-events:none}
  .sh-head{display:flex;align-items:center;gap:10px;position:relative}
  .sh-date{background:var(--accent);color:#fff;border-radius:16px;padding:6px 14px 4px;font-size:18px}
  .sh-q{color:var(--num);font-size:17px}
  .sh-x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--num);font:inherit;font-size:20px;line-height:36px;cursor:pointer}
  .tabs{display:flex;gap:8px;margin:16px 0 10px;position:relative}
  .tab{border:0;font:inherit;font-size:16px;padding:8px 18px 6px;border-radius:18px;background:var(--soft);color:var(--num);cursor:pointer}
  .tab small{font-size:12px;opacity:.7;margin-left:3px}
  .tab.on{background:var(--accent);color:#fff}
  .stks{display:grid;grid-template-columns:repeat(6,1fr);gap:4px 6px;max-height:372px;overflow-y:auto;position:relative;padding:4px 2px;align-content:start;-webkit-overflow-scrolling:touch}
  .sb{border:0;background:transparent;padding:8px 0 6px;border-radius:18px;font:inherit;color:#3e4152;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .sv{position:relative;display:block}
  .sv img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
  .sb .sv{width:46px;height:46px;margin:2px 0 4px;transition:transform .15s}
  .stk .sv{width:100%;height:100%}
  .sb.sel{background:#fbefd9;box-shadow:inset 0 0 0 2px var(--line)}
  .sh-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;position:relative;min-height:38px}
  .rm{border:0;font:inherit;font-size:15px;padding:8px 16px 6px;border-radius:16px;background:transparent;color:#b0705a;box-shadow:inset 0 0 0 1.5px #e7b9a6;cursor:pointer}
  .hint{font-size:13px;color:#b9a58c}

  /* ---- 일간 ---- */
  #stage.v-day #tools,#stage.v-rec #tools{display:flex}
  body.purple{--bgc:#c4b5df;--bgimg:none;--accent:#8b74c9;--num:#6f5fb0;--soft:#ece6f7;--line:#b9a8e0;--blob:#b9a8e0}
  body.edge::before,body.edge::after{content:"";position:fixed;top:0;bottom:0;width:50%;background-repeat:repeat-x;background-size:2px var(--sh,680px);background-position:0 var(--sy,0px)}
  body.edge::before{left:0;background-image:var(--edgeL),linear-gradient(var(--tL) 50%,var(--bL) 50%);background-size:2px var(--sh,680px),100% 100%;background-repeat:repeat-x,no-repeat;background-position:0 var(--sy,0px),0 0}
  body.edge::after{right:0;background-image:var(--edgeR),linear-gradient(var(--tR) 50%,var(--bR) 50%);background-size:2px var(--sh,680px),100% 100%;background-repeat:repeat-x,no-repeat;background-position:0 var(--sy,0px),0 0}
  body.mint{--bgc:#9ad6c6;--bgimg:none;--accent:#4a9f86;--num:#3f8a74;--soft:#e3f2ec;--line:#6fbfa8;--blob:#6fbfa8}
  body.olive{--bgc:#bbce80;--bgimg:none;--accent:#7fa42a;--num:#6b8a24;--soft:#eef3dc;--line:#a9c35c;--blob:#a9c35c}
  body.edge.memoLine{--edgeL:url(__memoLine_edgeL__);--edgeR:url(__memoLine_edgeR__);--tL:#9ad6c6;--bL:#9bd6c7;--tR:#9dd6c7;--bR:#98d5c5}
  body.edge.memoDot{--edgeL:url(__memoDot_edgeL__);--edgeR:url(__memoDot_edgeR__);--tL:#bbce80;--bL:#bcce82;--tR:#bdcf84;--bR:#bacd7d}
  #stage.v-memo #tools{display:flex;left:300px}
  .memo-ta{position:absolute;left:92px;width:840px;border:0;background:transparent;resize:none;outline:none;padding:0;overflow:hidden;font-family:'Gaegu',cursive;font-weight:700;color:#4f4636;-webkit-user-select:text;user-select:text}
  .memo-ta.line{left:120px;width:812px;top:122px;height:480px;font-size:21px;line-height:32px}
  .memo-ta.dot{top:118px;height:506px;font-size:17px;line-height:22px}
  .ptype{position:absolute;border:0;background:transparent;border-radius:10px;cursor:pointer;padding:0}
  .ptype.on{box-shadow:0 0 0 2px var(--accent)}
  #memoPg{position:absolute;left:512px;top:648px;transform:translateX(-50%);font-size:12px;color:var(--num);background:#fffcf2;border-radius:10px;padding:2px 10px 1px;opacity:.85;pointer-events:none}
  body.edge.cover{--edgeL:url(__cover_edgeL__);--edgeR:url(__cover_edgeR__);--tL:#c1b5d9;--bL:#fff6d9;--tR:#c1b5d9;--bR:#fff6d9}
  body.edge.me{--edgeL:url(__profile_edgeL__);--edgeR:url(__profile_edgeR__);--tL:#c1b5d9;--bL:#fffcf2;--tR:#c1b5d9;--bR:#fffcf2}
  #stage{z-index:1}
  #mePhotoBtn{position:absolute;left:195px;top:157px;width:144px;height:144px;border:0;padding:0;background:transparent;border-radius:46%;cursor:pointer;overflow:hidden}
  #mePhoto{position:absolute;left:8px;top:8px;width:128px;height:128px;object-fit:cover;border-radius:44%}
  #mePhotoDel{position:absolute;left:322px;top:160px;width:26px;height:26px;border-radius:50%;border:0;background:#fffcf2;color:#8b74c9;font-size:13px;box-shadow:0 1px 4px rgba(60,40,100,.25);cursor:pointer}
  .me-name{position:absolute;left:206px;top:388px;width:116px;height:30px;border:0;outline:none;text-align:center;font:18px 'Gaegu',cursive;font-weight:700;color:#5a4b8c;background:transparent;padding:0;border-radius:14px}
  .me-name::placeholder{color:transparent}
  .me-name:not(:placeholder-shown){background:#fffcf2}
  .me-a{position:absolute;height:24px;border:0;outline:none;background:transparent;font:17px 'Gaegu',cursive;font-weight:700;color:#5a4b8c;padding:0}
  .me-link{position:absolute;height:36px;border:0;background:transparent;cursor:pointer;border-radius:12px}
  .mc{position:absolute;z-index:0;width:26px;height:20px;margin-left:-13px;border:0;padding:0;background:transparent;font:11px/20px 'Jua',sans-serif;color:var(--num);cursor:pointer}
  .mc.out{opacity:.35;pointer-events:none}
  .mc.today{color:#fff}
  .mc.today::before{content:"";position:absolute;left:5px;top:1px;width:16px;height:18px;border-radius:9px;background:#8b74c9;z-index:-1}
  .mc .sv{position:absolute;left:4px;top:0;width:18px;height:18px}
  #stage{touch-action:none}
  .turn-next{animation:turnNext .28s ease-out}
  .turn-prev{animation:turnPrev .28s ease-out}
  @keyframes turnNext{from{opacity:.35;transform:translateX(36px)}to{opacity:1;transform:none}}
  @keyframes turnPrev{from{opacity:.35;transform:translateX(-36px)}to{opacity:1;transform:none}}
  #stage.v-rec #tools{left:361px;gap:4px}
  body.rec{--bgc:#8bd0bd;--bgimg:url(__rec_bg__);--accent:#4a9f86;--num:#8a6a3a;--blob:#6fbfa8;--line:#6fbfa8;--soft:#e3f2ec}
  .rq{position:absolute;width:262px;height:66px;font:17px/22px 'Gaegu',cursive;font-weight:700;color:#5b4a36;border:0;background:transparent;resize:none;outline:none;padding:0;overflow:hidden;-webkit-user-select:text;user-select:text}
  #recInk{z-index:2}
  .ext{position:absolute;left:-400px;top:-400px;width:1824px;height:1480px;pointer-events:none;overflow:visible}
  .ext path{opacity:.5;fill:var(--blob)}
  body.nov .ext .d{display:none}
  .pg{position:absolute;left:0;top:0;width:527px;height:680px}
  .pdate{position:absolute;left:214px;top:64.5px;width:100px;height:20px;line-height:20px;text-align:center;font-size:14px;color:var(--num);pointer-events:none}
  .main-slot{position:absolute;z-index:3;left:214px;top:136px;width:98px;height:90px;border:0;background:transparent;padding:0;cursor:pointer;border-radius:30px}
  .main-slot .stk{position:absolute;left:14px;top:10px;width:70px;height:70px;animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
  .main-slot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#d5c9a2;line-height:1.3;text-align:center}
  .tag{position:absolute;top:262px;width:70px;height:24px;border:0;background:transparent;font:16px 'Gaegu',cursive;font-weight:700;color:#7d6a4c;padding:0;outline:none}
  .mini{position:absolute;z-index:3;top:326px;width:24px;height:24px;border:0;background:transparent;padding:1px;cursor:pointer}
  .mini .sv{width:22px;height:22px}
  .ta{position:absolute;border:0;background:transparent;resize:none;outline:none;padding:0;margin:0;
      font:17px/22px 'Gaegu',cursive;font-weight:700;color:#5b4a36;overflow:hidden;-webkit-user-select:text;user-select:text}
  .ta::placeholder{color:#d9cfae;font-weight:400}
  .feel{left:76px;top:355px;width:372px;height:154px}
  .tmr{left:80px;top:554px;width:372px;height:66px;text-indent:122px}
  .ink{position:absolute;z-index:2;left:27px;top:49px;width:473px;height:616px;pointer-events:none;touch-action:none}
  #stage.pen .ink{pointer-events:auto}
  #tools{position:absolute;z-index:4;display:none;left:300px;top:13px;height:34px;gap:6px;align-items:center}
  .seg{display:flex;background:rgba(255,252,242,.55);border-radius:17px;padding:3px}
  .seg button{border:0;background:transparent;width:38px;height:28px;border-radius:14px;font:inherit;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--num);cursor:pointer}
  .seg button.on{background:#fffcf2;color:var(--accent);box-shadow:0 1px 3px rgba(80,50,20,.18)}
  .tb{border:0;width:32px;height:32px;border-radius:50%;background:rgba(255,252,242,.55);color:var(--num);font:inherit;font-size:15px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
  #stage.pen .tb{display:flex}
  .tb.on{background:#fffcf2;box-shadow:inset 0 0 0 2px var(--accent)}
  .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .cwrap{position:relative;display:none}
  #stage.pen .cwrap{display:block}
  #cpop{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:#fffcf2;border-radius:16px;padding:8px 10px;display:none;gap:8px;
        box-shadow:0 4px 14px rgba(80,50,20,.22);z-index:5}
  #cpop.on{display:flex}
  #cpop::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#fffcf2}
  .sw{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;background:transparent;display:flex;align-items:center;justify-content:center}
  .sw i{width:20px;height:20px;border-radius:50%;display:block}
  .sw.sel{box-shadow:0 0 0 2px #fffcf2,0 0 0 4px var(--accent)}
  .sw.sel i{display:flex;align-items:center;justify-content:center}
  .sw.sel i::after{content:"";width:6px;height:6px;border-radius:50%;background:#fffcf2}
  #tColor i{width:18px;height:18px;border-radius:50%;background:var(--pen,#3e4152);display:block}
  .nav{position:absolute;top:326px;width:34px;height:48px;border:0;border-radius:17px;background:rgba(255,252,242,.7);color:var(--accent);font:26px/1 'Jua';cursor:pointer;box-shadow:0 1px 4px rgba(80,50,20,.15)}
  .day .dot{position:absolute;left:4px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.6}
  .foot-r{display:flex;gap:8px;align-items:center}
  .go-day{border:0;font:inherit;font-size:15px;padding:8px 16px 6px;border-radius:16px;background:var(--accent);color:#fff;cursor:pointer}
  #toast{position:absolute;z-index:60;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(62,65,82,.85);color:#fff;padding:9px 18px 7px;border-radius:18px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.on{opacity:1}
</style>
</head>

<script>
const STICKERS = __STICKERS__;
const CELL = {nov:"__nov_cell__", dec:"__dec_cell__"};
const DAYBG = {nov:"__nov_daily__", dec:"__dec_daily__"};
const RECBG = ["__rec1__", "__rec2__", "__rec3__"];
const CATS = [["pos","긍정"],["neg","부정"],["mix","복합"]];
const BY_ID = {}; for (const c in STICKERS) for (const s of STICKERS[c]) BY_ID[s.id] = s;
// 피그마 원본 SVG 그대로, 몸통 중심을 기준으로 정중앙 정렬
// 피그마 '감정' 원본 컴포넌트를 그대로 렌더한 이미지 — 몸통 중심을 칸 정중앙에
function svgOf(id){ const s = BY_ID[id]; return `<span class="sv"><img src="${s.src}" alt="" draggable="false" style="left:${s.l}%;top:${s.t}%;width:${s.w}%;height:${s.h}%"></span>`; }

// ---- 저장 (아이패드 브라우저 안에 저장) ----
const KEY = "emodiary.v1";
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { data = {}; }
// 클라우드 저장(claude.ai 계정, 나만 보는 공간) — 쓸 수 있으면 함께 저장
let cloudRef = null, writing = false, dirty = false;
async function cloudPush(){
  if (!cloudRef) return;
  if (writing){ dirty = true; return; }
  writing = true;
  try { await cloudRef.set({ stickers: data, ver: 2, updatedAt: Date.now() }); } catch (e) {}
  writing = false;
  if (dirty){ dirty = false; cloudPush(); }
}
// 첫 시험판(PNG 스티커)에서 쓰던 번호를 지금 번호로 바꿔요
function migrate(obj, isOld){
  const out = {};
  for (const k in obj){
    let id = obj[k]; const m = /^(pos|neg|mix)(\d+)$/.exec(id || "");
    if (m && isOld){ const n = +m[2];
      if (m[1] === "neg") id = "neg" + String(n - 14).padStart(2, "0");
      if (m[1] === "mix") id = "mix" + String(n - 31).padStart(2, "0");
    }
    if (BY_ID[id]) out[k] = id;
  }
  return out;
}
let localVer = 0; try { localVer = +localStorage.getItem(KEY + ".ver") || 0; } catch (e) {}
data = migrate(data, localVer < 2);
try { localStorage.setItem(KEY + ".ver", "2"); localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} cloudPush(); }
(async () => {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    cloudCol = db.collection("data/users/" + id);
    const ref = cloudCol.doc("diary");
    const snap = await ref.get();
    const v = snap && (typeof snap.data === "function" ? snap.data() : (snap.data ?? snap));
    cloudRef = ref;
    const remote = migrate((v && v.stickers) || {}, !(v && v.ver >= 2));
    const merged = Object.assign({}, data, remote);
    const changed = JSON.stringify(merged) !== JSON.stringify(data);
    data = merged;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    if (changed) render();
    if (!(v && v.ver >= 2) || Object.keys(data).length !== Object.keys(remote).length) cloudPush();
  } catch (e) {}
})();

// ---- 화면 크기 맞춤: 가운데 정렬 + 비율 유지 ----
const stage = document.getElementById("stage");
function fit(){
  const vw = innerWidth, vh = innerHeight;
  const s = Math.min(vw / 1024, vh / 680);
  stage.style.transform = `translate(${-512*s}px, ${-340*s}px) scale(${s})`;
  document.body.style.setProperty("--sh", (680 * s) + "px");
  document.body.style.setProperty("--sy", (vh / 2 - 340 * s) + "px");
}
addEventListener("resize", fit); addEventListener("orientationchange", () => setTimeout(fit, 200)); fit();

// ---- 달력 ----
const grid = document.getElementById("grid");
const WD = ["일","월","화","수","목","금","토"];
let cur = "2026-11";
const pad = n => String(n).padStart(2, "0");
function rot(key){ let h = 0; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) | 0; return ((Math.abs(h) % 11) - 5); }

function render(){
  const [y, m] = cur.split("-").map(Number);
  const th = m === 11 ? "nov" : "dec";
  document.body.className = th;
  document.querySelectorAll(".layer").forEach(l => l.classList.toggle("on", l.dataset.th === th));
  const first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7;           // 월요일 시작
  const days = new Date(y, m, 0).getDate();
  const rows = Math.ceil((lead + days) / 7);
  const step = rows === 5 ? 97 : (460 - 72) / (rows - 1);
  const t = new Date(); const todayKey = `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
  grid.innerHTML = "";
  for (let i = 0; i < rows * 7; i++){
    const d = new Date(y, m - 1, 1 - lead + i);
    const inMonth = d.getMonth() === m - 1;
    const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const b = document.createElement("button");
    b.className = "day" + (inMonth ? "" : " out") + (key === todayKey ? " today" : "");
    b.style.left = (9 + (i % 7) * 102) + "px";
    b.style.top = (Math.floor(i / 7) * step) + "px";
    b.dataset.key = key;
    b.setAttribute("aria-label", `${d.getMonth()+1}월 ${d.getDate()}일`);
    b.innerHTML = `<img class="cell" src="${CELL[th]}" alt=""><span class="num">${d.getDate()}</span>`;
    if (inMonth && data[key] && BY_ID[data[key]]) addSticker(b, data[key], key);
    if (inMonth && hasDiary(key)) b.insertAdjacentHTML("beforeend", '<i class="dot"></i>');
    b.onclick = () => openSheet(key);
    grid.appendChild(b);
  }
}
function addSticker(btn, id, key){
  const w = document.createElement("span");
  w.className = "stk"; w.innerHTML = svgOf(id); w.setAttribute("aria-label", BY_ID[id].name);
  btn.appendChild(w);
}

// ---- 일기 데이터 (글: localStorage, 손글씨: IndexedDB) ----
const DKEY = "emodiary.days";
let days = {};
try { days = JSON.parse(localStorage.getItem(DKEY) || "{}") || {}; } catch (e) {}
function dayOf(k){ return days[k] || (days[k] = {tags:["","",""], feel:"", tmr:"", minis:[], ink:false, t:0}); }
function hasDiary(k){ const d = days[k]; return !!d && (d.ink || d.feel || d.tmr || d.tags.some(Boolean) || d.minis.some(Boolean)); }
const pushTimers = {};
function saveDay(k){
  const d = dayOf(k); d.t = Date.now();
  try { localStorage.setItem(DKEY, JSON.stringify(days)); } catch (e) {}
  clearTimeout(pushTimers[k]); pushTimers[k] = setTimeout(() => pushDay(k), 1200);
}
let idb = null;
const idbReady = new Promise(res => {
  try { const r = indexedDB.open("emodiary", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("ink");
    r.onsuccess = () => { idb = r.result; res(); }; r.onerror = () => res();
  } catch (e) { res(); }
});
async function inkGet(k){ await idbReady; if (!idb) return null;
  return new Promise(res => { try { const q = idb.transaction("ink").objectStore("ink").get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }); }
async function inkPut(k, v){ await idbReady; if (!idb) return;
  try { const tx = idb.transaction("ink", "readwrite"); v ? tx.objectStore("ink").put(v, k) : tx.objectStore("ink").delete(k); } catch (e) {} }
// 클라우드: 날짜별 문서
let cloudCol = null;
async function pushDay(k){
  if (!cloudCol) return;
  const d = dayOf(k); const ink = d.ink ? await inkGet(k) : null;
  try { await cloudCol.doc("day-" + k).set({ tags: d.tags, feel: d.feel, tmr: d.tmr, minis: d.minis, ink: ink || "", t: d.t }); } catch (e) {}
}
async function pullDay(k){
  if (!cloudCol) return false;
  try {
    const snap = await cloudCol.doc("day-" + k).get();
    const v = snap && (typeof snap.data === "function" ? snap.data() : (snap.data ?? snap));
    if (!v || !v.t || v.t <= (days[k]?.t || 0)) return false;
    days[k] = { tags: v.tags || ["","",""], feel: v.feel || "", tmr: v.tmr || "", minis: v.minis || [], ink: !!v.ink, t: v.t };
    await inkPut(k, v.ink || null);
    try { localStorage.setItem(DKEY, JSON.stringify(days)); } catch (e) {}
    return true;
  } catch (e) { return false; }
}

// ---- 팝업 (월간 날짜 / 일간 대표 감정 / 작은 감정 칸 공용) ----
const dim = document.getElementById("dim"), tabs = document.getElementById("tabs"), stks = document.getElementById("stks");
const rm = document.getElementById("rm"), hint = document.getElementById("hint"), goDay = document.getElementById("goDay");
let target = null, cat = "pos";
CATS.forEach(([c, label]) => {
  const t = document.createElement("button");
  t.className = "tab"; t.dataset.c = c;
  t.innerHTML = `${label}<small>${STICKERS[c].length}</small>`;
  t.onclick = () => { cat = c; drawStickers(); };
  tabs.appendChild(t);
});
function curSel(){ if (!target) return null;
  const id = target.type === "main" ? data[target.key] : (days[target.key]?.minis || [])[target.idx];
  return BY_ID[id] ? id : null; }
function drawStickers(){
  tabs.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.c === cat));
  const sel = curSel();
  stks.innerHTML = "";
  for (const s of STICKERS[cat]){
    const b = document.createElement("button");
    b.className = "sb" + (s.id === sel ? " sel" : "");
    b.innerHTML = `${svgOf(s.id)}<span>${s.name}</span>`;
    b.onclick = () => pick(s.id);
    stks.appendChild(b);
  }
  stks.scrollTop = 0;
}
function openSheet(key, type = "main", idx = 0){
  target = { key, type, idx };
  const d = new Date(key + "T00:00:00");
  document.getElementById("shDate").textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
  document.querySelector(".sh-q").textContent = type === "main" ? "오늘은 어떤 기분인가요?" : "함께 느낀 감정을 골라요";
  const sel = curSel();
  if (sel){ for (const c in STICKERS) if (STICKERS[c].some(s => s.id === sel)) cat = c; }
  rm.hidden = !sel;
  goDay.hidden = view !== "month";
  hint.textContent = sel ? `지금 붙은 스티커: ${BY_ID[sel].name}` : "스티커를 누르면 바로 붙어요";
  drawStickers();
  dim.classList.add("on");
}
function closeSheet(){ dim.classList.remove("on"); target = null; }
function apply(id){
  const { key, type, idx } = target;
  if (type === "main"){ if (id) data[key] = id; else delete data[key]; save(); }
  else { const d = dayOf(key); d.minis[idx] = id || ""; saveDay(key); }
  closeSheet();
  if (view === "month") render(); else renderDay();
}
function pick(id){ setTimeout(() => apply(id), 220); }   // 눌림 효과를 보여준 뒤 붙이기
rm.onclick = () => apply(null);
goDay.onclick = () => { const k = target.key; closeSheet(); openDay(k); };
document.getElementById("shX").onclick = closeSheet;
dim.addEventListener("click", e => { if (e.target === dim) closeSheet(); });

// ---- 화면 전환 ----
let view = "month";
const memoView = document.getElementById("memoView");
const introView = document.getElementById("introView"), coverView = document.getElementById("coverView"), meView = document.getElementById("meView");
const monthView = document.getElementById("monthView"), dayView = document.getElementById("dayView"), recView = document.getElementById("recView");
function setView(v){
  view = v;
  monthView.hidden = v !== "month"; dayView.hidden = v !== "day"; recView.hidden = v !== "rec"; introView.hidden = v !== "intro";
  coverView.hidden = v !== "cover"; meView.hidden = v !== "me"; memoView.hidden = v !== "memo";
  stage.classList.remove("v-month", "v-day", "v-rec", "v-intro", "v-cover", "v-me", "v-memo"); stage.classList.add("v-" + v);
  document.querySelectorAll(".gnb-hit").forEach(b => b.style.zIndex = 5);
}
function showMonth(ym){ commitAll(); if (ym) cur = ym; setView("month"); render(); }

// ---- 일간 ----
let dayKey = null;
const K = 2.5;                       // 손글씨 해상도 배율
const PEN_COLORS = ["#3e4152", "#b47739", "#e2566a", "#3a8fd0"];
let penColor = 0, erasing = false;
const pages = [...document.querySelectorAll(".pg")].map((el, side) => {
  el.innerHTML = `
    <div class="pdate"></div>
    <button class="main-slot" aria-label="대표 감정"></button>
    <input class="tag" style="left:140px" maxlength="8" enterkeyhint="next">
    <input class="tag" style="left:239px" maxlength="8" enterkeyhint="next">
    <input class="tag" style="left:337px" maxlength="8" enterkeyhint="done">
    ${[346,374,403,432].map((x,i)=>`<button class="mini" data-i="${i}" style="left:${x}px" aria-label="함께 느낀 감정 ${i+1}"></button>`).join("")}
    <textarea class="ta feel" placeholder="오늘 있었던 일과 느낀 감정을 적어요"></textarea>
    <textarea class="ta tmr" placeholder=""></textarea>
    <canvas class="ink" width="${Math.round(473*K)}" height="${Math.round(616*K)}"></canvas>`;
  const pg = { el, side, key: null, strokes: [], base: null,
    date: el.querySelector(".pdate"), slot: el.querySelector(".main-slot"),
    tags: [...el.querySelectorAll(".tag")], minis: [...el.querySelectorAll(".mini")],
    feel: el.querySelector(".feel"), tmr: el.querySelector(".tmr"), cv: el.querySelector(".ink") };
  pg.ctx = pg.cv.getContext("2d");
  pg.slot.onclick = () => openSheet(pg.key, "main");
  pg.minis.forEach(b => b.onclick = () => openSheet(pg.key, "mini", +b.dataset.i));
  const onText = () => { if (!pg.key) return; const d = dayOf(pg.key);
    d.tags = pg.tags.map(i => i.value.trim()); d.feel = pg.feel.value; d.tmr = pg.tmr.value; saveDay(pg.key); };
  [...pg.tags, pg.feel, pg.tmr].forEach(i => i.addEventListener("input", onText));
  // 줄 수 넘치면 더 못 쓰게 (줄 노트 칸 안에서만)
  [[pg.feel, 7], [pg.tmr, 3]].forEach(([ta, rows]) => ta.addEventListener("input", () => {
    while (ta.scrollHeight > rows * 22 + 2 && ta.value.length) ta.value = ta.value.slice(0, -1);
  }));
  pg.tags.forEach((inp, i) => inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); (pg.tags[i+1] || pg.feel).focus(); } }));
  setupInk(pg);
  return pg;
});

function keyAdd(k, n){ const d = new Date(k + "T00:00:00"); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function openDay(k){
  commitAll();
  dayKey = k; setView("day");
  renderDay(true);
  Promise.all(pages.map(p => pullDay(p.key))).then(ch => { if (ch.some(Boolean)) renderDay(true); });
}
async function renderDay(force = false){
  const m = +dayKey.slice(5, 7);
  const th = m === 11 ? "nov" : "dec";
  document.body.className = th;
  document.getElementById("dayBg").src = th === "nov" ? DAYBG.nov : DAYBG.dec;
  for (const pg of pages){
    const k = keyAdd(dayKey, pg.side); const changed = pg.key !== k; pg.key = k;
    const d = new Date(k + "T00:00:00"); const e = days[k] || dayOf(k);
    pg.date.textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}`;

  memoIdx = n; renderMemo(); turn(memoView, dir);
}
document.getElementById("memoPrev").onclick = () => memoStep(-1);
document.getElementById("memoNext").onclick = () => memoStep(1);

// ---- 모든 버튼: 누르면 작아졌다가 → 살짝 커졌다가 → 제자리 ----
const NO_BUMP = ".gnb-hit, #coverGo, .me-link";
document.addEventListener("pointerdown", e => {
  const b = e.target.closest("button");
  if (!b || b.matches(NO_BUMP) || b.disabled) return;
  if (stage.classList.contains("pen") && e.pointerType === "pen" && b.closest(".pg, #recView, #memoView") && !b.matches(".main-slot, .mini, .nav")) return;
  b.getAnimations().forEach(a => a.id === "bump" && a.cancel());
  const a = b.animate([{ transform: "scale(1)" }, { transform: "scale(.86)", offset: .35 }, { transform: "scale(1.06)", offset: .7 }, { transform: "scale(1)" }],
    { duration: 340, easing: "ease-out" });
  a.id = "bump";
}, true);

// ---- 상단 메뉴 ----
const toast = document.getElementById("toast"); let tt;
function showToast(msg){ toast.textContent = msg; toast.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("on"), 1400); }
document.querySelectorAll(".gnb-hit").forEach(b => b.onclick = () => {
  const g = b.dataset.go;
  if (g === "soon") return showToast(`${b.getAttribute("aria-label")} 화면은 다음 단계에서 만들어요`);
  if (g === "rec") return openRec(recPage);
  if (g === "intro") return openIntro(introPage);
  if (g === "cover") return openCover();
  if (g === "me") return openMe();
  if (g === "memo") return openMemo(memoIdx);
  showMonth(g);
});

// 처음 열 때: 오늘이 11·12월이면 그 달, 아니면 11월
(() => { const t = new Date(); if (t.getFullYear() === 2026 && (t.getMonth() === 10 || t.getMonth() === 11)) cur = `2026-${t.getMonth()+1}`; })();
setView("month");
render();
</script>
