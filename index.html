 <!-- 내 소개 -->

  <button id="mePhotoDel" aria-label="사진 지우기" hidden>✕</button>
  <input type="file" id="meFile" accept="image/*" hidden>
  <input id="meName" class="me-name" maxlength="12" placeholder="이름을 적어 주세요" enterkeyhint="next">
  <input class="me-a" style="left:223px;top:446px;width:173px" maxlength="20" enterkeyhint="next">
  <input class="me-a" style="left:211px;top:485px;width:185px" maxlength="20" enterkeyhint="next">
  <input class="me-a" style="left:183px;top:524px;width:213px" maxlength="20" enterkeyhint="next">
  <input class="me-a" style="left:246px;top:563px;width:150px" maxlength="20" enterkeyhint="done">

 </div>

  <div id="memoPg"></div>
  <button class="nav" id="memoPrev" style="left:-4px" aria-label="이전 장">‹</button>
  <button class="nav" id="memoNext" style="left:994px" aria-label="다음 장">›</button>
 </div>

 </div>

  <button class="gnb-hit" style="left:948px;width:52px" data-go="memo" aria-label="메모"></button>

    </div>
